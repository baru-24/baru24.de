<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BaRu24 – Einfach. Digital. Verwaltet.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafb;
      color: #102433;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Helvetica, Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 40px 24px;
      text-align: center;
    }

    .brand {
      font-size: clamp(64px, 12vw, 110px);
      font-weight: 500;
      letter-spacing: -5px;
      line-height: 1;
    }

    .brand .number {
      color: #67aaa8;
    }

    .claim {
      margin-top: 18px;
      font-size: clamp(17px, 3vw, 24px);
      letter-spacing: 3px;
    }

    .claim .accent {
      color: #67aaa8;
    }

    .line {
      width: 64px;
      height: 2px;
      margin: 55px auto 40px;
      background: #67aaa8;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(23px, 4vw, 34px);
      font-weight: 400;
    }

    p {
      margin: 0;
      color: #718087;
      font-size: 17px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="brand">
      BaRu<span class="number">24</span>
    </div>

    <div class="claim">
      Einfach. Digital. <span class="accent">Verwaltet.</span>
    </div>

    <div class="line"></div>

    <h1>Unsere Website befindet sich aktuell im Aufbau.</h1>

    <p>
      Hier entsteht moderne Immobilienverwaltung.
    </p>

  </main>
</body>
</html>
